name: 'Docker Build and Publish'
description: 'Build and publish Docker image'
inputs:
  startupProject: 
    description: 'Project path that has the Dockerfile'
    required: true
  githubPublishPackageToken:
    description: 'Github authentication token used to push the docker image, tipically the {{ secrets.GITHUB_TOKEN }}'
    required: true
  artifactId:
    description: 'Artifact name with dist folder published'
    required: true
  skipCheckout:
    description: 'Skip checkout step (set to "true" if the code is already available in the runner, e.g., cloned at workflow level or from a previous job)'
    required: false
    default: 'false'
  fetchDepth:
    description: 'Number of commits to fetch (used if checkout is not skipped)'
    required: false
    default: '1'
  azureLogin:
    description: |
      Set "true" to perform Azure login inside this action.
      When enabled, the caller MUST expose the following environment variables
      (typically via the job- or step-level `env:` block, sourced from secrets):
        AZURE_CLIENT_ID         - Azure AD app / managed identity client ID
        AZURE_TENANT_ID         - Azure AD tenant ID
        AZURE_SUBSCRIPTION_ID   - Target Azure subscription ID
    required: false
    default: 'true'
outputs:
  docker_image_tag:
    description: "Docker image tag generated in this action"
    value: ${{ steps.docker_publish.outputs.docker_image_tag }}
runs:
  using: composite
  steps:

    - name: Checkout caller repository
      if: inputs.skipCheckout != 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetchDepth }}

    - name: Extract Git Information
      id: git_info
      shell: bash
      run: |
        # Get short commit SHA
        echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          
        # Get branch name or tag
        # if [[ "${{ github.event_name }}" == "push" ]]; then
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "$TAG_NAME"
          else
            echo "BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi
        # fi

    - name: Resolve stack settings
      id: stack_settings
      shell: bash
      run: |
          echo "artifact_path=build" >> $GITHUB_OUTPUT
          echo "docker_context=." >> $GITHUB_OUTPUT
          echo "dockerfile=${{ inputs.startupProject }}/Dockerfile" >> $GITHUB_OUTPUT
          echo "build_args=--build-arg source=build" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.githubPublishPackageToken }}

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifactId }}
        path: ${{ steps.stack_settings.outputs.artifact_path }}


    - name: Build Dockerfile and Push image
      id: docker_publish
      shell: bash
      run: |
        TAG="latest"

        if [ -n "${{ env.TAG_NAME }}" ]; then
          TAG="${{ env.TAG_NAME }}"
        elif [ -n "${{ env.BRANCH_NAME }}" ]; then
          TAG="${{ env.BRANCH_NAME }}-${{ env.GIT_SHA }}"
        fi


        # Lowercase the owner/repo — GHCR requires lowercase image names
        IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          

        # Build Docker image
        docker build ${{ steps.stack_settings.outputs.build_args }} \
          -f ${{ steps.stack_settings.outputs.dockerfile }} \
          -t $IMAGE:$TAG \
          ${{ steps.stack_settings.outputs.docker_context }}
        echo "Pushing Docker image with tag $TAG"
        docker push $IMAGE:$TAG
        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "docker_image_tag=$TAG" >> $GITHUB_OUTPUT
        echo "${{ github.ref_name }}"

        docker logout ghcr.io      