name: 'Publish NuGet Package'
description: 'Packs a .NET project and publishes it to the Vicgital GitHub Packages NuGet feed'

inputs:
  startupProject:
    description: 'Path to the .csproj file to pack'
    required: true
  githubPublishPackageToken:
    description: 'Github authentication token used to push the package, tipically the {{ secrets.GITHUB_TOKEN }}'
    required: true
  dotnetVersion:
    description: '.NET SDK version to use'
    required: false
    default: '10.0.x'
  skipCheckout:
    description: 'Skip checkout step (set to "true" if the code is already available in the runner, e.g., cloned at workflow level or from a previous job)'
    required: false
    default: 'false'
  fetchDepth:
    description: 'Number of commits to fetch (used if checkout is not skipped)'
    required: false
    default: '1'

runs:
  using: composite
  steps:

    - name: Checkout caller repository
      if: inputs.skipCheckout != 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetchDepth }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnetVersion }}

    - name: Run Dotnet Pack
      shell: bash
      run: dotnet pack "${{ inputs.startupProject }}"  -c Release -o ./nupkg

    - name: Push to GitHub Packages
      shell: bash
      run: dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/vicgital/index.json" --api-key ${{ inputs.githubPublishPackageToken }} --skip-duplicate
